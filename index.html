<!DOCTYPE html>
<html lang="en">
<head>
    <title>Web Design Experiment 1</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f4f4;
            color: #333;
        }
        header, footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
        nav {
            background: #444;
            text-align: center;
            padding: 12px;
        }
        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
        }
        section {
            padding: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Web Design Experiment 1</h1>
        <p>GitHub Repository and GitHub Pages</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="home">
        <h1>Welcome to My Webpage</h1>
        <p>This website demonstrates GitHub Pages.</p>
    </section>

    <section id="about">
        <h2>About</h2>
        <p>GitHub stores projects and GitHub Pages publishes websites.</p>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>Email: student@example.com</p>
    </section>

    <footer>
        <p>Web Design Experiment 1</p>
    </footer>
</body>
</html>
